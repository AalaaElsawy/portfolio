<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aalaa Mohamed | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #F8FAFC;
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #1E293B;
      --primary-soft: #334155;
      --accent: #10B981;
      --accent-dark: #059669;
      --accent-tint: rgba(16, 185, 129, 0.12);
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-soft: rgba(226, 232, 240, 0.9);
      --shadow-card: 0 18px 45px rgba(30, 41, 59, 0.08);
      --shadow-btn: 0 4px 14px rgba(30, 41, 59, 0.04);
      --shadow-btn-hover: 0 10px 24px rgba(16, 185, 129, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 44px 16px;
      position: relative;
      overflow-x: hidden;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(155deg, #F8FAFC 0%, #EEF2F6 52%, #E6F7F1 100%),
        radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.18), transparent 42%),
        radial-gradient(circle at 90% 18%, rgba(30, 41, 59, 0.11), transparent 44%),
        radial-gradient(circle at 50% 95%, rgba(16, 185, 129, 0.12), transparent 48%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(30, 41, 59, 0.055) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 85%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-soft);
      border-radius: 28px;
      padding: 36px 24px 28px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    .avatar-ring {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      padding: 3.5px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      margin: 0 auto 14px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      background-color: #FFFFFF;
      display: block;
    }

    .name {
      font-size: 1.42rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.015em;
      margin-bottom: 5px;
    }

    .bio {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .badge-row {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background-color: var(--accent-tint);
      color: var(--accent-dark);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .links-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 54px;
      padding: 12px 20px;
      background-color: #FFFFFF;
      color: var(--primary);
      border: 1.5px solid #E2E8F0;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 600;
      box-shadow: var(--shadow-btn);
      transition: all 0.22s ease;
    }

    .link-btn:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      box-shadow: var(--shadow-btn-hover);
      transform: translateY(-2px);
    }

    .link-btn.featured {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-soft) 100%);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .link-btn.featured:hover {
      background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
      border-color: var(--accent-dark);
      color: #FFFFFF;
    }

    .btn-label {
      flex: 1;
      text-align: center;
    }

    .btn-arrow {
      font-size: 0.95rem;
      opacity: 0.75;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .link-btn:hover .btn-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    .footer {
      margin-top: 26px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 12px;
        align-items: flex-start;
      }

      .container {
        padding: 28px 18px 24px;
        border-radius: 22px;
      }

      .link-btn {
        min-height: 50px;
        padding: 11px 16px;
        font-size: 0.93rem;
      }
    }
  </style>
</head>
